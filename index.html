<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشريط المفقود - لعبة الغموض والهزل</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="language-selector">
        <button class="lang-btn active" data-lang="ar">العربية</button>
        <button class="lang-btn" data-lang="en">English</button>
        <button class="lang-btn" data-lang="fr">Français</button>
    </div>

    <div id="game-container">
        <div id="start-screen" class="screen active">
            <div id="title-section">
                <h1 class="game-title">الشريط المفقود</h1>
                <p class="game-subtitle">لعبة من الغموض والهزل</p>
                <button id="start-btn">ابدأ اللعبة</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
